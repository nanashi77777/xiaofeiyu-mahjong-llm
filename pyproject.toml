[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "xiaofeiyu-mahjong-llm"
version = "0.1.0"
description = "Pure LLM Mahjong Soul decisions with authoritative events and physical input"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.28,<1",
  "pydantic>=2.10,<3", "playwright>=1.50,<2", "mahjong==1.4.0",
  "protobuf>=5,<7", "grpcio-tools>=1.68,<2", "tzdata>=2025.1",
  "numpy>=2,<3", "opencv-python-headless>=4.10,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.9,<1"]

[project.scripts]
majsoul-llm = "majsoul_llm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
majsoul_llm = ["*.html", "*.js", "assets/majsoul_wrapper/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
extend-safe-fixes = ["F401"]

[tool.ruff.lint.per-file-ignores]
"src/majsoul_llm/app.py" = ["B008"]
